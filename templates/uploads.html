<!DOCTYPE html>

<html lang="en">

<head>

    <meta charset="UTF-8">

    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>Text Extraction</title>

    <script src="https://ajax.googleapis.com/ajax/libs/jquery/3.5.1/jquery.min.js"></script>

    <script src="https://kit.fontawesome.com/a076d05399.js" crossorigin="anonymous"></script>

    <style>

        body {

            margin: 0;

            overflow: hidden;

        }

        .background-video {

            position: fixed;

            top: 0;

            left: 0;

            width: 100%;

            height: 100%;

            object-fit: cover;

            z-index: -1;

        }

        .container {

            display: flex;

            flex-direction: column;

            justify-content: center;

            align-items: center;

            height: 100vh;

            color: white;

            text-shadow: 1px 1px 2px rgba(0, 0, 0, 0.7);

        }

        h1 {

            margin-top: 5px;

            font-size: 35px;

            color: rgb(255, 0, 191);

            position: absolute;

            top: 10px;

        }

        .back {

            position: fixed;

            top: 10px;

            left: 10px;

            background-color: #5edef1;

            color: white;

            padding: 8px;

            border-radius: 8px;

            z-index: 1;

        }

        .back a {

            color: black;

            text-decoration: none;

            font-weight: bold;

        }

        #object_detection {

            max-width: 100%;

            max-height: 100%;

            border: 2px solid rgba(255, 255, 255, 0.8);

            border-radius: 5px;

            box-shadow: 0 0 10px rgba(0, 0, 0, 0.5);

        }

    </style>

</head>

<body>

    <video class="background-video" autoplay muted loop>

        <source src="static/bg.webm" type="video/webm">

        Your browser does not support the video tag.

    </video>

    <div class="back">

        <a href="/stop_video_feed"><i class="fas fa-arrow-left"></i> Back</a>

    </div>

    <div class="container">

        <h1>Live Camera Stream</h1>

        <img src="{{ url_for('video_feed') }}" width="720" height="540">

        <div>

            <img id="object_detection" src="{{ url_for('text_feed') }}" alt="Live Text Extraction" />

        </div>

    </div>

</body>

</html>
